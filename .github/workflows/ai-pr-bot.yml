name: AI PR Bot

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write
  contents: read

jobs:
  ai-review:
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Get PR diff
        id: pr-diff
        run: |
          git fetch origin ${{ github.base_ref }}
          DIFF=$(git diff origin/${{ github.base_ref }}...HEAD -- '*.ts' '*.tsx' '*.js' '*.jsx' '*.json' '*.yml' '*.yaml' | head -c 8000)
          echo "diff<<EOF" >> $GITHUB_OUTPUT
          echo "$DIFF" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: AI Code Review
        if: steps.pr-diff.outputs.diff != ''
        uses: actions/github-script@v7
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        with:
          script: |
            const axios = require('axios');
            
            const diff = `${{ steps.pr-diff.outputs.diff }}`;
            
            if (!process.env.OPENAI_API_KEY) {
              console.log('⚠️ OPENAI_API_KEY not configured. Skipping AI review.');
              return;
            }

            try {
              const response = await axios.post(
                'https://api.openai.com/v1/chat/completions',
                {
                  model: 'gpt-3.5-turbo',
                  messages: [
                    {
                      role: 'system',
                      content: 'You are a helpful code reviewer. Analyze the code changes and provide concise, constructive feedback. Focus on: 1) potential bugs, 2) security issues, 3) performance concerns, 4) best practices. Keep responses under 500 words.'
                    },
                    {
                      role: 'user',
                      content: `Review this PR diff:\n\n${diff.substring(0, 4000)}`
                    }
                  ],
                  temperature: 0.3,
                  max_tokens: 800,
                  top_p: 0.9
                },
                {
                  headers: {
                    'Authorization': `Bearer ${process.env.OPENAI_API_KEY}`,
                    'Content-Type': 'application/json'
                  }
                }
              );

              const review = response.data.choices[0].message.content;

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: `## 🤖 AI Code Review\n\n${review}\n\n---\n*This is an automated review. Please use your judgment when addressing suggestions.*`
              });

              console.log('✅ AI review posted successfully');
            } catch (error) {
              console.error('❌ Error during AI review:', error.message);
              if (error.response) {
                console.error('Response:', error.response.data);
              }
            }

      - name: Comment if no changes
        if: steps.pr-diff.outputs.diff == ''
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '🤖 AI PR Bot: No code changes detected in supported file types.'
            });
